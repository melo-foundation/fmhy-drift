name: FMHY Index Drift & GitHub Activity Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "whitelist.json"
  schedule:
    # Weekly every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      github_only:
        description: "GitHub repos only (skips proxy-free DoH DNS & proxy HTTP site checks)"
        required: false
        default: false
        type: boolean
      warn_days_1:
        description: "Tier 1 (Notice) GitHub inactivity threshold in days"
        required: false
        default: "90"
        type: string
      warn_days_2:
        description: "Tier 2 (Warning) GitHub inactivity threshold in days"
        required: false
        default: "180"
        type: string
      warn_days_3:
        description: "Tier 3 (Critical) GitHub inactivity threshold in days"
        required: false
        default: "365"
        type: string
      category_filter:
        description: "Optional category substring filter (blank = entire FMHY index)"
        required: false
        default: ""
        type: string
      starred_only:
        description: "Only check starred (recommended) entries"
        required: false
        default: false
        type: boolean
      max_entries:
        description: "Optional max entries limit for quick test runs (0 = all)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  drift-check:
    name: FMHY Drift & GitHub Staleness Audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: "drift-check-${{ github.ref }}"
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: uv sync --frozen || uv sync

      - name: Run FMHY drift and GitHub staleness check
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_ONLY: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.github_only) || vars.GITHUB_ONLY || 'false' }}
          WARN_DAYS_1: ${{ inputs.warn_days_1 || vars.WARN_DAYS_1 || '90' }}
          WARN_DAYS_2: ${{ inputs.warn_days_2 || vars.WARN_DAYS_2 || '180' }}
          WARN_DAYS_3: ${{ inputs.warn_days_3 || vars.WARN_DAYS_3 || '365' }}
          CATEGORY_FILTER: ${{ inputs.category_filter || '' }}
          MAX_ENTRIES: ${{ inputs.max_entries || '0' }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.starred_only }}" = "true" ]; then
            EXTRA_ARGS+=(--starred-only)
          fi
          uv run fmhy-drift \
            --skip-without-proxy \
            --whitelist whitelist.json \
            --markdown-out reports/fmhy-drift-report.md \
            --json-out reports/fmhy-drift-report.json \
            --html-out reports/index.html \
            "${EXTRA_ARGS[@]}"

      - name: Upload Markdown and JSON drift reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmhy-drift-reports-${{ github.run_number }}
          path: |
            reports/fmhy-drift-report.md
            reports/fmhy-drift-report.json
            reports/index.html
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

      - name: Upload GitHub Pages triage site
        if: success() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.category_filter == '' && inputs.max_entries == '0' && !inputs.starred_only))
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

  deploy-pages:
    name: Deploy Triage UI to GitHub Pages
    needs: drift-check
    if: success() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.category_filter == '' && inputs.max_entries == '0' && !inputs.starred_only))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}

    steps:
      - name: Deploy Triage UI to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4

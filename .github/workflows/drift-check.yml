name: FMHY Index Drift & GitHub Activity Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "whitelist.json"
  schedule:
    # Weekly every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      github_only:
        description: "GitHub repos only (skips proxy-free DoH DNS & proxy HTTP site checks)"
        required: false
        default: false
        type: boolean
      warn_days_1:
        description: "Tier 1 (Notice) GitHub inactivity threshold in days"
        required: false
        default: "90"
        type: string
      warn_days_2:
        description: "Tier 2 (Warning) GitHub inactivity threshold in days"
        required: false
        default: "180"
        type: string
      warn_days_3:
        description: "Tier 3 (Critical) GitHub inactivity threshold in days"
        required: false
        default: "365"
        type: string
      category_filter:
        description: "Optional category substring filter (blank = entire FMHY index)"
        required: false
        default: ""
        type: string
      starred_only:
        description: "Only check starred (recommended) entries"
        required: false
        default: false
        type: boolean
      max_entries:
        description: "Optional max entries limit for quick test runs (0 = all)"
        required: false
        default: "0"
        type: string
      only_alt_forges:
        description: "Reuse existing GitHub & DNS results from Pages and only scan non-GitHub forges"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  drift-check:
    name: FMHY Drift & GitHub Staleness Audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: "drift-check-${{ github.ref }}"
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if push only modified UI or workflow (fast Pages redeploy)
        id: check_ui_only
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || echo "all")
            if [ -n "${CHANGED}" ] && ! echo "${CHANGED}" | grep -qvE '^(src/fmhy_drift/triage_ui\.py|\.github/workflows/.*|README\.md|whitelist\.json)$'; then
              if curl -fsSL "https://melo-foundation.github.io/fmhy-drift/fmhy-drift-report.json" -o /tmp/prev-report.json && \
                 curl -fsSL "https://melo-foundation.github.io/fmhy-drift/fmhy-drift-report.md" -o /tmp/prev-report.md; then
                mkdir -p reports
                mv /tmp/prev-report.json reports/fmhy-drift-report.json
                mv /tmp/prev-report.md reports/fmhy-drift-report.md
                cp whitelist.json reports/whitelist.json
                PYTHONPATH=src python3 -c "from pathlib import Path; from fmhy_drift.triage_ui import write_triage_site; write_triage_site(Path('reports/index.html'))"
                echo "Fast UI-only redeploy: reusing existing report data from GitHub Pages."
                echo "ui_only=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
          fi
          echo "ui_only=false" >> "${GITHUB_OUTPUT}"

      - name: Install uv and Python 3.12
        if: steps.check_ui_only.outputs.ui_only != 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        if: steps.check_ui_only.outputs.ui_only != 'true'
        run: uv sync --frozen || uv sync

      - name: Restore site-signal cache
        if: steps.check_ui_only.outputs.ui_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/signal-cache.json
          key: signal-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            signal-cache-

      - name: Run FMHY drift and GitHub staleness check
        if: steps.check_ui_only.outputs.ui_only != 'true'
        # Leaves headroom inside the 90-minute job for the cache save and Pages upload.
        timeout-minutes: 80
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
          # Empty = CLI default (30 min full run, 5 min incremental --only-alt-forges run).
          SIGNAL_BUDGET_MINUTES: ${{ vars.SIGNAL_BUDGET_MINUTES || '' }}
          STORE_WARN_DAYS_1: ${{ vars.STORE_WARN_DAYS_1 || '365' }}
          STORE_WARN_DAYS_2: ${{ vars.STORE_WARN_DAYS_2 || '730' }}
          STORE_WARN_DAYS_3: ${{ vars.STORE_WARN_DAYS_3 || '1095' }}
          GITHUB_ONLY: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.github_only) || vars.GITHUB_ONLY || 'false' }}
          WARN_DAYS_1: ${{ inputs.warn_days_1 || vars.WARN_DAYS_1 || '90' }}
          WARN_DAYS_2: ${{ inputs.warn_days_2 || vars.WARN_DAYS_2 || '180' }}
          WARN_DAYS_3: ${{ inputs.warn_days_3 || vars.WARN_DAYS_3 || '365' }}
          CATEGORY_FILTER: ${{ inputs.category_filter || '' }}
          MAX_ENTRIES: ${{ inputs.max_entries || '0' }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.starred_only }}" = "true" ]; then
            EXTRA_ARGS+=(--starred-only)
          fi
          if curl -fsSL "https://melo-foundation.github.io/fmhy-drift/fmhy-drift-report.json" -o /tmp/published-report.json; then
            EXTRA_ARGS+=(--previous-report /tmp/published-report.json)
          fi
          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || echo "")
          if [ "${{ inputs.only_alt_forges }}" = "true" ] || { [ "${{ github.event_name }}" = "push" ] && ! echo "${COMMIT_MSG}" | grep -qi '\[full-scan\]'; }; then
            if curl -fsSL "https://melo-foundation.github.io/fmhy-drift/fmhy-drift-report.json" -o /tmp/prev-report.json; then
              IS_FRESH=$(python3 -c '
          import json
          from datetime import UTC, datetime
          try:
              d = json.load(open("/tmp/prev-report.json"))
              ts = datetime.fromisoformat(d["generated_at"].replace("Z", "+00:00")).astimezone(UTC)
              age = (datetime.now(UTC) - ts).total_seconds()
              repos = int((d.get("summary") or {}).get("unique_repos_checked") or 0)
              print("yes" if (age < 21600 and repos >= 1000) else "no")
          except Exception:
              print("no")
          ')
              if [ "${{ inputs.only_alt_forges }}" = "true" ] || [ "${IS_FRESH}" = "yes" ]; then
                echo "Reusing fresh GitHub + DNS report (<6h old) and scanning non-GitHub forges + new enrichments..."
                EXTRA_ARGS+=(--reuse-report /tmp/prev-report.json --only-alt-forges)
              fi
            fi
          fi
          uv run fmhy-drift \
            --skip-without-proxy \
            --whitelist whitelist.json \
            --markdown-out reports/fmhy-drift-report.md \
            --json-out reports/fmhy-drift-report.json \
            --html-out reports/index.html \
            --signal-cache .cache/signal-cache.json \
            "${EXTRA_ARGS[@]}"

      - name: Save site-signal cache
        if: always() && steps.check_ui_only.outputs.ui_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/signal-cache.json
          key: signal-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Markdown and JSON drift reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmhy-drift-reports-${{ github.run_number }}
          path: |
            reports/fmhy-drift-report.md
            reports/fmhy-drift-report.json
            reports/index.html
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

      - name: Upload GitHub Pages triage site
        if: success() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.category_filter == '' && inputs.max_entries == '0' && !inputs.starred_only))
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

  deploy-pages:
    name: Deploy Triage UI to GitHub Pages
    needs: drift-check
    if: success() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.category_filter == '' && inputs.max_entries == '0' && !inputs.starred_only))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}

    steps:
      - name: Deploy Triage UI to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4
